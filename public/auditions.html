<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WACL — backdrop auditions, round two</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; background: #0b0e12; color: #eef1f6; overflow: hidden; }

  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; padding: 12px; background: rgba(11,14,18,0.82); backdrop-filter: blur(6px);
    border-bottom: 1px solid #27303c; }
  .bar button { font: 700 13px/1 Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
    color: #98a1b3; background: #12161c; border: 1px solid #313b49; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .bar button.on { background: #53d337; border-color: #53d337; color: #06210a; }

  /* ---- aurora: always on, the layer that's staying ---- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .aurora i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: 0.11; }
  .aurora i:nth-child(1) { background: #53d337; animation: d1 37s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: #ffb636; animation: d2 47s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: #2bd9d2; opacity: 0.07; animation: d3 53s ease-in-out infinite alternate; }
  @keyframes d1 { from { top: -25%; left: -20%; } to { top: 15%; left: 45%; } }
  @keyframes d2 { from { bottom: -30%; right: -15%; } to { bottom: 10%; right: 50%; } }
  @keyframes d3 { from { top: 55%; left: 60%; } to { top: 10%; left: -10%; } }

  .layer { position: fixed; inset: 0; z-index: 1; display: none; }
  .layer.on { display: block; }

  /* ---- stadium sweep ---- */
  .sweep i { position: absolute; top: -20%; bottom: -20%; width: 34vw; transform: skewX(-14deg);
    filter: blur(28px); opacity: 0.55; }
  .sweep i:nth-child(1) { background: linear-gradient(90deg, transparent, rgba(83,211,55,0.10), transparent); animation: sweep 21s linear infinite; }
  .sweep i:nth-child(2) { background: linear-gradient(90deg, transparent, rgba(255,182,54,0.07), transparent); animation: sweep 34s linear 8s infinite; }
  @keyframes sweep { from { left: -40vw; } to { left: 120vw; } }

  /* ---- gridiron horizon ---- */
  .grid3d { perspective: 420px; overflow: hidden; }
  .grid3d .floor { position: absolute; left: -60%; right: -60%; bottom: -12%; height: 68%;
    transform: rotateX(62deg); transform-origin: bottom center;
    background:
      repeating-linear-gradient(0deg, rgba(83,211,55,0.14) 0 2px, transparent 2px 72px),
      repeating-linear-gradient(90deg, rgba(83,211,55,0.09) 0 2px, transparent 2px 110px);
    animation: roll 4.5s linear infinite;
    mask-image: linear-gradient(to top, #000 55%, transparent);
    -webkit-mask-image: linear-gradient(to top, #000 55%, transparent); }
  @keyframes roll { from { background-position: 0 0, 0 0; } to { background-position: 0 72px, 0 0; } }

  .content { position: relative; z-index: 10; height: 100%; display: grid; place-items: center; padding: 72px 16px 16px; }
  .card { width: min(520px, 92vw); background: linear-gradient(180deg, #151a21, #12161c);
    border: 1px solid #27303c; border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.5); overflow: hidden; }
  .card header { padding: 10px 14px; background: #1a2028; border-bottom: 1px solid #27303c;
    font: 700 11px/1 Inter, sans-serif; letter-spacing: 0.16em; color: #67707f; text-transform: uppercase; }
  .card .big { padding: 14px; }
  .card .big .n { font: italic 800 52px/1 'Barlow Condensed', Inter, sans-serif; color: #53d337;
    text-shadow: 0 0 26px rgba(83,211,55,0.35); }
  .card .big p { margin-top: 8px; font-size: 13px; color: #98a1b3; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 13px;
    border-top: 1px solid rgba(39,48,60,0.7); }
  .row b { color: #53d337; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="bar">
  <button data-bg="none" class="on">Aurora Alone</button>
  <button data-bg="constellation">League Constellation</button>
  <button data-bg="pulse">Market Pulse</button>
  <button data-bg="sweep">+ Stadium Sweep</button>
  <button data-bg="grid3d">+ Gridiron Horizon</button>
  <button data-bg="embers">+ Ember Drift</button>
</div>

<div class="aurora"><i></i><i></i><i></i></div>

<canvas class="layer" id="constellation"></canvas>
<canvas class="layer" id="pulse"></canvas>
<div class="layer sweep" id="sweep"><i></i><i></i></div>
<div class="layer grid3d" id="grid3d"><div class="floor"></div></div>
<canvas class="layer" id="embers"></canvas>

<div class="content">
  <div class="card">
    <header>Committed through 2028</header>
    <div class="big">
      <div class="n">$374</div>
      <p>Every option here plays over the aurora you kept — judge the combination, not the layer.</p>
    </div>
    <div class="row"><span>Alex · SuperBowlJesus</span><b>+$9</b></div>
    <div class="row"><span>Stu · I Must Break You</span><b>+$26</b></div>
    <div class="row"><span>Tajar · Malikety Split</span><b>+$30</b></div>
  </div>
</div>

<script>
const layers = {};
document.querySelectorAll('.layer').forEach(l => layers[l.id] = l);
let current = 'none';
document.querySelectorAll('.bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.bar .on')?.classList.remove('on');
    btn.classList.add('on');
    if (layers[current]) layers[current].classList.remove('on');
    current = btn.dataset.bg;
    if (layers[current]) layers[current].classList.add('on');
  });
});

/* ---------- LEAGUE CONSTELLATION ----------
   The twelve managers as drifting stars in their own colours, linking up
   when they wander near each other. The league as a night sky. */
{
  const COLORS = ['#5a83ff','#ff5f52','#8be356','#b07cff','#ffa92e','#3fe0f5',
                  '#ff6fb3','#2bd9d2','#6b7dff','#2ad68a','#c98d5f','#ffd84d'];
  const cv = layers.constellation, ctx = cv.getContext('2d');
  let stars = [];
  function size() {
    cv.width = innerWidth; cv.height = innerHeight;
    stars = COLORS.map(c => ({
      c,
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: 2.5 + Math.random() * 1.5,
      w: Math.random() * Math.PI * 2,
    }));
  }
  addEventListener('resize', size); size();
  const LINK = 190;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'constellation') return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      s.x += s.vx; s.y += s.vy; s.w += 0.008;
      if (s.x < -20) s.x = innerWidth + 20; if (s.x > innerWidth + 20) s.x = -20;
      if (s.y < -20) s.y = innerHeight + 20; if (s.y > innerHeight + 20) s.y = -20;
    }
    // links first, under the stars
    for (let i = 0; i < stars.length; i++) for (let j = i + 1; j < stars.length; j++) {
      const a = stars[i], b = stars[j];
      const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
      if (d > LINK) continue;
      const alpha = (1 - d / LINK) * 0.22;
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, a.c); g.addColorStop(1, b.c);
      ctx.strokeStyle = g; ctx.globalAlpha = alpha; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (const s of stars) {
      const breathe = 0.55 + Math.sin(s.w) * 0.2;
      ctx.globalAlpha = breathe;
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = breathe * 0.25;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  })(0);
}

/* ---------- MARKET PULSE ----------
   One slow heartbeat line writing itself across the bottom of the room —
   the league's pulse. Random-walks, spikes occasionally, fades behind itself. */
{
  const cv = layers.pulse, ctx = cv.getContext('2d');
  let points = [], head = 0, y = 0;
  function size() {
    cv.width = innerWidth; cv.height = innerHeight;
    y = innerHeight * 0.72;
    points = []; head = 0;
  }
  addEventListener('resize', size); size();
  let last = 0;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'pulse' || t - last < 33) return;
    last = t;
    // advance the walk
    const prev = points.length ? points[points.length - 1].v : 0;
    let v = prev + (Math.random() - 0.5) * 8;
    if (Math.random() < 0.012) v += (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 50); // a trade lands
    v = Math.max(-90, Math.min(90, v * 0.985));
    points.push({ x: head, v });
    head += 2.2;
    if (head > innerWidth + 40) size();
    if (points.length > 900) points.shift();

    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (i === 0) ctx.moveTo(p.x, y - p.v);
      else ctx.lineTo(p.x, y - p.v);
    }
    ctx.strokeStyle = 'rgba(83,211,55,0.30)';
    ctx.shadowColor = 'rgba(83,211,55,0.5)'; ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // the writing head glows
    const tip = points[points.length - 1];
    ctx.fillStyle = 'rgba(83,211,55,0.9)';
    ctx.beginPath(); ctx.arc(tip.x, y - tip.v, 2.4, 0, Math.PI * 2); ctx.fill();
  })(0);
}

/* ---------- EMBER DRIFT ---------- */
{
  const cv = layers.embers, ctx = cv.getContext('2d');
  let ps = [];
  function size() { cv.width = innerWidth; cv.height = innerHeight; ps = Array.from({ length: 70 }, () => spawn(true)); }
  function spawn(anywhere) {
    return { x: Math.random() * innerWidth, y: anywhere ? Math.random() * innerHeight : innerHeight + 6,
      s: 2 + (Math.random() * 3 | 0), v: 0.15 + Math.random() * 0.5, w: Math.random() * Math.PI * 2,
      amber: Math.random() < 0.22 };
  }
  addEventListener('resize', size); size();
  let last = 0;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'embers' || t - last < 33) return;
    last = t;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.y -= p.v; p.w += 0.01;
      const x = p.x + Math.sin(p.w) * 14;
      const pulse = 0.25 + 0.35 * (0.5 + Math.sin(t / 900 + i) / 2);
      ctx.fillStyle = p.amber ? `rgba(255,182,54,${pulse})` : `rgba(83,211,55,${pulse})`;
      ctx.fillRect(x | 0, p.y | 0, p.s, p.s);
      if (p.y < -8) ps[i] = spawn(false);
    }
  })(0);
}
</script>
</body>
</html>
