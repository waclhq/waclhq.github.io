<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WACL — backdrop auditions, loud round</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; background: #0b0e12; color: #eef1f6; overflow: hidden; }

  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; padding: 12px; background: rgba(11,14,18,0.82); backdrop-filter: blur(6px);
    border-bottom: 1px solid #27303c; }
  .bar button { font: 700 13px/1 Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
    color: #98a1b3; background: #12161c; border: 1px solid #313b49; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .bar button.on { background: #53d337; border-color: #53d337; color: #06210a; }

  canvas.fx { position: fixed; inset: 0; z-index: 0; display: none; }
  canvas.fx.on { display: block; }

  .content { position: relative; z-index: 10; height: 100%; display: grid; place-items: center; padding: 72px 16px 16px; }
  .card { width: min(520px, 92vw); background: linear-gradient(180deg, rgba(21,26,33,0.92), rgba(18,22,28,0.92));
    border: 1px solid #27303c; border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.55); overflow: hidden;
    backdrop-filter: blur(2px); }
  .card header { padding: 10px 14px; background: rgba(26,32,40,0.9); border-bottom: 1px solid #27303c;
    font: 700 11px/1 Inter, sans-serif; letter-spacing: 0.16em; color: #67707f; text-transform: uppercase; }
  .card .big { padding: 14px; }
  .card .big .n { font: italic 800 52px/1 'Barlow Condensed', Inter, sans-serif; color: #53d337;
    text-shadow: 0 0 26px rgba(83,211,55,0.35); }
  .card .big p { margin-top: 8px; font-size: 13px; color: #98a1b3; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 13px;
    border-top: 1px solid rgba(39,48,60,0.7); }
  .row b { color: #53d337; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="bar">
  <button data-fx="nebula" class="on">Nebula Flow</button>
  <button data-fx="constellation">Constellation XL</button>
  <button data-fx="warp">Warp Field</button>
  <button data-fx="flood">Floodlights</button>
  <button data-fx="comet">Big Play Comet</button>
</div>

<canvas class="fx on" id="nebula"></canvas>
<canvas class="fx" id="constellation"></canvas>
<canvas class="fx" id="warp"></canvas>
<canvas class="fx" id="flood"></canvas>
<canvas class="fx" id="comet"></canvas>

<div class="content">
  <div class="card">
    <header>Committed through 2028</header>
    <div class="big">
      <div class="n">$374</div>
      <p>Loud round — every effect at full volume. The winner ships almost exactly this hot; panels get a whisper of frost so text never fights the light.</p>
    </div>
    <div class="row"><span>Alex · SuperBowlJesus</span><b>+$9</b></div>
    <div class="row"><span>Stu · I Must Break You</span><b>+$26</b></div>
    <div class="row"><span>Tajar · Malikety Split</span><b>+$30</b></div>
  </div>
</div>

<script>
const layers = {};
document.querySelectorAll('canvas.fx').forEach(c => {
  layers[c.id] = c;
  c.ctx = c.getContext('2d');
});
let current = 'nebula';
function sizeAll() {
  for (const id in layers) { layers[id].width = innerWidth; layers[id].height = innerHeight; }
}
addEventListener('resize', sizeAll); sizeAll();
document.querySelectorAll('.bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.bar .on')?.classList.remove('on');
    btn.classList.add('on');
    layers[current].classList.remove('on');
    current = btn.dataset.fx;
    layers[current].classList.add('on');
  });
});

const GREEN = [83,211,55], AMBER = [255,182,54], TEAL = [43,217,210], BLUE = [90,131,255], PINK = [255,111,179];
const MANAGERS = ['#5a83ff','#ff5f52','#8be356','#b07cff','#ffa92e','#3fe0f5',
                  '#ff6fb3','#2bd9d2','#6b7dff','#2ad68a','#c98d5f','#ffd84d'];

/* ============ NEBULA FLOW — saturated colour weather, clearly moving ============ */
{
  const cv = layers.nebula, ctx = cv.ctx;
  const blobs = [
    { c: GREEN, r: 0.55, s1: 0.00016, s2: 0.00011, p: 0 },
    { c: AMBER, r: 0.48, s1: 0.00013, s2: 0.00019, p: 2 },
    { c: TEAL,  r: 0.50, s1: 0.00021, s2: 0.00009, p: 4 },
    { c: PINK,  r: 0.38, s1: 0.00010, s2: 0.00015, p: 1 },
  ];
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'nebula') return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      const x = cv.width  * (0.5 + 0.42 * Math.sin(t * b.s1 + b.p));
      const y = cv.height * (0.5 + 0.42 * Math.cos(t * b.s2 + b.p * 1.7));
      const r = Math.max(cv.width, cv.height) * b.r;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${b.c},0.34)`);
      g.addColorStop(0.5, `rgba(${b.c},0.13)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cv.width, cv.height);
    }
    ctx.globalCompositeOperation = 'source-over';
  })(0);
}

/* ============ CONSTELLATION XL — the league as a bright night sky ============ */
{
  const cv = layers.constellation, ctx = cv.ctx;
  let stars = [], meteors = [], nextMeteor = 3000;
  function seed() {
    stars = MANAGERS.map(c => ({
      c, x: Math.random() * cv.width, y: Math.random() * cv.height,
      vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
      r: 3.5 + Math.random() * 2.5, w: Math.random() * 7,
    }));
  }
  seed(); addEventListener('resize', seed);
  const LINK = 260;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'constellation') return;
    ctx.clearRect(0, 0, cv.width, cv.height);

    // shooting star every ~6s
    if (t > nextMeteor) {
      nextMeteor = t + 4000 + Math.random() * 5000;
      const fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? -40 : cv.width + 40, y: Math.random() * cv.height * 0.5,
        vx: (fromLeft ? 1 : -1) * (7 + Math.random() * 5), vy: 2.5 + Math.random() * 2,
        life: 1, c: MANAGERS[(Math.random() * MANAGERS.length) | 0],
      });
    }

    for (const s of stars) {
      s.x += s.vx; s.y += s.vy; s.w += 0.012;
      if (s.x < -30) s.x = cv.width + 30; if (s.x > cv.width + 30) s.x = -30;
      if (s.y < -30) s.y = cv.height + 30; if (s.y > cv.height + 30) s.y = -30;
    }
    for (let i = 0; i < stars.length; i++) for (let j = i + 1; j < stars.length; j++) {
      const a = stars[i], b = stars[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > LINK) continue;
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, a.c); g.addColorStop(1, b.c);
      ctx.strokeStyle = g; ctx.globalAlpha = (1 - d / LINK) * 0.55; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const s of stars) {
      const breathe = 0.75 + Math.sin(s.w) * 0.25;
      ctx.shadowColor = s.c; ctx.shadowBlur = 18 * breathe;
      ctx.fillStyle = s.c; ctx.globalAlpha = breathe;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    meteors = meteors.filter(m => m.life > 0);
    for (const m of meteors) {
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      g.addColorStop(0, m.c); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = g; ctx.globalAlpha = Math.max(0, m.life) * 0.9; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  })(0);
}

/* ============ WARP FIELD — flying through the league's colours ============ */
{
  const cv = layers.warp, ctx = cv.ctx;
  let stars = [];
  function seed() {
    stars = Array.from({ length: 220 }, () => ({
      a: Math.random() * Math.PI * 2,
      d: Math.random(),                      // 0 centre → 1 edge
      v: 0.0016 + Math.random() * 0.0035,
      c: Math.random() < 0.75 ? `rgb(${GREEN})` : (Math.random() < 0.5 ? `rgb(${AMBER})` : `rgb(${TEAL})`),
    }));
  }
  seed();
  (function tick() {
    requestAnimationFrame(tick);
    if (current !== 'warp') return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const cx = cv.width / 2, cy = cv.height / 2;
    const R = Math.hypot(cx, cy);
    for (const s of stars) {
      s.d += s.v * (0.3 + s.d * 2.2);        // accelerate outward
      if (s.d > 1) { s.a = Math.random() * Math.PI * 2; s.d = 0.02 + Math.random() * 0.1; }
      const r1 = s.d * R, r0 = Math.max(0, r1 - (4 + s.d * 34));
      const x0 = cx + Math.cos(s.a) * r0, y0 = cy + Math.sin(s.a) * r0;
      const x1 = cx + Math.cos(s.a) * r1, y1 = cy + Math.sin(s.a) * r1;
      ctx.strokeStyle = s.c; ctx.globalAlpha = Math.min(0.7, s.d * 1.1);
      ctx.lineWidth = 0.8 + s.d * 2.2;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  })();
}

/* ============ FLOODLIGHTS — stadium night, beams you can feel ============ */
{
  const cv = layers.flood, ctx = cv.ctx;
  const beams = [
    { base: 0.15, hue: GREEN, w: 0.16, s: 0.00023, p: 0 },
    { base: 0.85, hue: AMBER, w: 0.14, s: 0.00019, p: 2 },
    { base: 0.5,  hue: TEAL,  w: 0.19, s: 0.00013, p: 4 },
    { base: 0.32, hue: BLUE,  w: 0.12, s: 0.00028, p: 1 },
  ];
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'flood') return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of beams) {
      const sway = Math.sin(t * b.s + b.p) * 0.55;             // beam angle sweeps
      const topX = cv.width * b.base;
      const botX = topX + sway * cv.width * 0.6;
      const half = cv.width * b.w;
      const g = ctx.createLinearGradient(botX - half, 0, botX + half, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.5, `rgba(${b.hue},0.20)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(topX - 14, -20);
      ctx.lineTo(topX + 14, -20);
      ctx.lineTo(botX + half, cv.height + 20);
      ctx.lineTo(botX - half, cv.height + 20);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  })(0);
}

/* ============ BIG PLAY COMET — quiet sky, then a play breaks open ============ */
{
  const cv = layers.comet, ctx = cv.ctx;
  let comet = null, sparks = [], nextAt = 1500;
  (function tick(t) {
    requestAnimationFrame(tick);
    if (current !== 'comet') return;
    ctx.clearRect(0, 0, cv.width, cv.height);

    // ambient: two soft drifting glows so the sky is never dead
    ctx.globalCompositeOperation = 'lighter';
    for (const [hue, sp, ph] of [[GREEN, 0.00011, 0], [AMBER, 0.00009, 3]]) {
      const x = cv.width * (0.5 + 0.4 * Math.sin(t * sp + ph));
      const y = cv.height * (0.45 + 0.3 * Math.cos(t * sp * 1.4 + ph));
      const g = ctx.createRadialGradient(x, y, 0, x, y, cv.width * 0.35);
      g.addColorStop(0, `rgba(${hue},0.16)`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    }

    if (!comet && t > nextAt) {
      const up = Math.random() < 0.5;
      comet = {
        x: -60, y: cv.height * (up ? 0.75 : 0.25),
        vx: 9 + Math.random() * 4, vy: (up ? -1 : 1) * (1.5 + Math.random() * 2),
        hue: Math.random() < 0.7 ? GREEN : AMBER,
      };
    }
    if (comet) {
      comet.x += comet.vx; comet.y += comet.vy;
      for (let k = 0; k < 5; k++) {
        sparks.push({
          x: comet.x - Math.random() * 30, y: comet.y + (Math.random() - 0.5) * 10,
          vx: -1 - Math.random() * 2, vy: (Math.random() - 0.5) * 1.6,
          life: 1, hue: comet.hue,
        });
      }
      const g = ctx.createRadialGradient(comet.x, comet.y, 0, comet.x, comet.y, 26);
      g.addColorStop(0, `rgba(${comet.hue},0.95)`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(comet.x, comet.y, 26, 0, Math.PI * 2); ctx.fill();
      if (comet.x > cv.width + 80) { comet = null; nextAt = t + 5000 + Math.random() * 6000; }
    }
    sparks = sparks.filter(s => s.life > 0);
    for (const s of sparks) {
      s.x += s.vx; s.y += s.vy; s.life -= 0.02;
      ctx.fillStyle = `rgba(${s.hue},${Math.max(0, s.life) * 0.8})`;
      ctx.fillRect(s.x | 0, s.y | 0, 3, 3);
    }
    ctx.globalCompositeOperation = 'source-over';
  })(0);
}
</script>
</body>
</html>
