name: Deploy watchdog

# Every ruling, keeper and cash entry is a commit to main, and only reaches the
# site when the Pages deploy runs. On 6 Oct 2026 GitHub left one deploy
# "waiting" at the github-pages gate for four days (no reviewers, no timer —
# just stuck), and every deploy after it queued behind it. The commissioner's
# saves landed in main but the site kept serving the old files, so a settled
# bet kept reopening once the app's five-minute bridge ran out.
#
# Twice an hour this checks two things and fixes them:
#   1. a deploy that has sat waiting or queued for 20+ minutes is cancelled,
#      so whatever is behind it can run;
#   2. if main's newest commit still isn't live 15 minutes later and nothing
#      is on its way, a fresh deploy is started.
# A healthy repo exits in a few seconds having done nothing.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deploy-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Unstick the Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          mins() { echo $(( (now - $(date -d "$1" +%s)) / 60 )); }
          runs() { gh api "repos/$REPO/actions/workflows/deploy.yml/runs?per_page=20"; }

          # 1. Stuck at the gate: waiting or queued, untouched for 20+ minutes.
          cancelled=0
          while read -r id status updated; do
            [ -n "$id" ] || continue
            age=$(mins "$updated")
            if [ "$age" -ge 20 ]; then
              echo "::warning title=Stuck deploy::Run $id has been $status for $age minutes; cancelling it."
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 \
                || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                || echo "::warning::Could not cancel run $id."
              cancelled=1
            fi
          done < <(runs | jq -r '.workflow_runs[] | select(.status=="waiting" or .status=="queued") | "\(.id) \(.status) \(.updated_at)"')
          [ "$cancelled" = 1 ] && sleep 20

          # 2. Main's newest commit isn't live and nothing is coming for it.
          head=$(gh api "repos/$REPO/commits/main")
          sha=$(jq -r .sha <<<"$head")
          committed=$(jq -r .commit.committer.date <<<"$head")
          latest=$(runs)
          live=$(jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].head_sha // ""' <<<"$latest")
          coming=$(jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha==$sha and .status!="completed")] | length' <<<"$latest")
          if [ "$live" = "$sha" ]; then
            echo "Live site is on ${sha:0:7}. Nothing to do."
          elif [ "$coming" -gt 0 ]; then
            echo "A deploy for ${sha:0:7} is on its way."
          elif [ "$(mins "$committed")" -lt 15 ]; then
            echo "${sha:0:7} is under 15 minutes old; giving its deploy time."
          else
            echo "::warning title=Site behind main::Live is ${live:0:7}, main is ${sha:0:7}; starting a deploy."
            gh workflow run deploy.yml --repo "$REPO" --ref main
          fi
