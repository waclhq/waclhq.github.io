name: Cloudflare live setup

# One-time (and safe to re-run): creates the KV namespace, deploys the
# wacl-live Worker that serves the live-points file with a short cache,
# seeds it with the current file, and prints the Worker's address.
# Needs the repository secret CLOUDFLARE_API_TOKEN. The account id is an
# identifier, not a credential, so it is written here (a secret overrides it).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '491c370f52e51dad84b8bc9104fad3d3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set."; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."; exit 1; }
          ok=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.success')
          [ "$ok" = "true" ] || { echo "::error::Cloudflare rejected the API token."; exit 1; }
          echo "Token verified."

      - name: Find or create the KV namespace
        id: kv
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          id=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=100" | jq -r '.result[]? | select(.title=="wacl-live") | .id')
          if [ -z "$id" ]; then
            id=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -d '{"title":"wacl-live"}' "$api" | jq -r '.result.id // empty')
          fi
          [ -n "$id" ] || { echo "::error::Could not create the KV namespace (does the token have Workers KV Storage: Edit?)."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "KV namespace: $id"

      - name: Workers subdomain
        id: sub
        run: |
          sub=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::This account has no workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once and pick one, then run this again."; exit 1; }
          echo "sub=$sub" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '491c370f52e51dad84b8bc9104fad3d3' }}
        run: |
          cat > worker/wrangler.toml <<TOML
          name = "wacl-live"
          main = "live.js"
          compatibility_date = "2026-09-01"
          workers_dev = true

          [[kv_namespaces]]
          binding = "LIVE"
          id = "${{ steps.kv.outputs.id }}"
          TOML
          npx --yes wrangler@4 deploy --config worker/wrangler.toml

      - name: Seed it with the current file and test the address
        run: |
          git fetch -q origin points && git show FETCH_HEAD:points.json > points.json
          curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" --data-binary @points.json \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/${{ steps.kv.outputs.id }}/values/points.json" | jq -c '{success, errors}'
          url="https://wacl-live.${{ steps.sub.outputs.sub }}.workers.dev/points.json"
          sleep 5
          code=$(curl -sS -D headers.txt -H 'Origin: https://waclhq.github.io' -o served.json -w '%{http_code}' "$url")
          grep -i -E '^(access-control-allow-origin|cache-control|content-type):' headers.txt || true
          echo "Worker address: $url"
          echo "Answered: $code, $(wc -c < served.json) bytes, week $(jq -r '.week' served.json 2>/dev/null)"
          echo "::notice title=Worker address::$url"
