name: Live points

# Scores the league's lineups from ESPN's public box scores while games are
# on, and publishes points.json to the orphan `points` branch (one commit,
# force-pushed, so main's log stays the audit trail). The Ledger reads it.
#
# Each run loops: score, publish if anything moved, sleep 60 s while a game is
# live, then stop when nothing is live or due inside the run's remaining time.
# Hourly starts on game days hand over to one another through the
# concurrency group; a start with nothing to do exits in seconds.

on:
  schedule:
    - cron: '50 12-23 * * 0'   # Sunday, London kickoffs through the late window
    - cron: '50 0-4 * * 1'     # Sunday night
    - cron: '50 23 * * 1'      # Monday night
    - cron: '50 0-4 * * 2'
    - cron: '50 23 * * 4'      # Thursday night
    - cron: '50 0-4 * * 5'
    - cron: '50 16-23 * * 6'   # Saturdays, late season
  workflow_dispatch:
    inputs:
      week:
        description: 'Score a finished regular-season week once without publishing (a test); blank for live'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: live-points
  cancel-in-progress: false

jobs:
  points:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Score and publish until the games are done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ inputs.week }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '491c370f52e51dad84b8bc9104fad3d3' }}
        run: |
          set -uo pipefail
          started=$(date +%s)
          cap=$((340 * 60))
          # Cloudflare mirror: the site reads the Worker first (about a minute
          # behind) and falls back to the branch (up to five). Found once per run.
          kv=""
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ]; then
            kv=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces?per_page=100" \
              | jq -r '.result[]? | select(.title=="wacl-live") | .id' || true)
            [ -n "$kv" ] && echo "Mirroring to Cloudflare KV $kv." || echo "::notice::Cloudflare secrets set but no wacl-live namespace; run Cloudflare live setup."
          fi
          mirror() {
            [ -n "$kv" ] || return 0
            curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $CF_TOKEN" --data-binary @"$1" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$kv/values/points.json" \
              | grep -q '^2' && echo "Mirrored." || echo "::warning::Cloudflare write failed; the branch still has it."
          }
          publish() {
            local fresh="$1"
            if git fetch -q origin points 2>/dev/null && git cat-file -e FETCH_HEAD:points.json 2>/dev/null; then
              if [ "$(git show FETCH_HEAD:points.json | jq -S 'del(.updatedAt)')" = "$(jq -S 'del(.updatedAt)' "$fresh")" ]; then
                echo "No change."
                return 0
              fi
            fi
            local stage
            stage="$(mktemp -d)"
            cp "$fresh" "$stage/points.json"
            git -C "$stage" init -q -b points
            git -C "$stage" -c user.name='live-points[bot]' -c user.email='live-points[bot]@users.noreply.github.com' add points.json
            git -C "$stage" -c user.name='live-points[bot]' -c user.email='live-points[bot]@users.noreply.github.com' \
              commit -q -m "Points as of $(date -u +'%Y-%m-%d %H:%M UTC')"
            git -C "$stage" push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" points:points \
              && echo "Published." || echo "::warning::Publish failed; will retry next pass."
            mirror "$fresh"
          }
          while :; do
            # Take the latest scoring code each pass, so a rules fix pushed
            # mid-game applies within ninety seconds instead of next run.
            git fetch -q origin main && git checkout -q FETCH_HEAD -- scripts/ || echo "::warning::Could not refresh scripts; using the checked-out copy."
            left=$(( (cap - ($(date +%s) - started)) / 60 ))
            args=(--out "$RUNNER_TEMP/points.json" --horizon "$left")
            # The last published file carries the day's history forward.
            if git fetch -q origin points 2>/dev/null && git show FETCH_HEAD:points.json > "$RUNNER_TEMP/prev.json" 2>/dev/null; then
              args+=(--previous "$RUNNER_TEMP/prev.json")
            fi
            [ -n "$WEEK" ] && args+=(--week "$WEEK" --debug-plays 1)
            if meta=$(node scripts/live-points.mjs "${args[@]}"); then
              echo "$meta"
              if [ -n "$WEEK" ]; then
                echo "Test run for week $WEEK: scored, not published."
                jq -c '{matchups: (.matchups|length), plays: (.plays|length), milestones: (.milestones|length), bytes: (tostring|length)}' "$RUNNER_TEMP/points.json"
              else
                publish "$RUNNER_TEMP/points.json"
              fi
              done=$(jq -r '.done' <<<"$meta")
              wait=$(jq -r '.nextPollSeconds' <<<"$meta")
            else
              echo "::warning::Scoring pass failed; retrying in two minutes."
              done=false
              wait=120
            fi
            [ "$done" = "true" ] && break
            [ $(( $(date +%s) - started + wait )) -ge "$cap" ] && { echo "Out of time; the next start takes over."; break; }
            sleep "$wait"
          done
