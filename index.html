<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e12" />
    <title>WACL League HQ — Wharton Alum Champions League</title>
    <meta
      name="description"
      content="Commissioner's ledger for the Wharton Alum Champions League: 22 seasons of standings, keeper contracts, trade approvals, and league finances."
    />
    <!-- Home-screen and tab icons: WACL in pixel neon, from scripts/make_icons.py -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The label under the icon on an iPhone home screen. -->
    <meta name="apple-mobile-web-app-title" content="WACL" />
    <meta name="application-name" content="WACL" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The three faces are served from this repo, not fonts.googleapis.com: a
      render-blocking stylesheet on a third party's origin means a slow lookup
      holds the site's first paint hostage, and on a phone that is most of the
      wait. Latin subsets, woff2, generated by scripts/fonts.mjs. The two the
      first screen actually needs are preloaded; the rest arrive as matched.
    -->
    <link rel="preload" href="/fonts/barlow-condensed-700-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/inter-var.woff2) format('woff2-variations')}
      @font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-700-italic.woff2) format('woff2')}
      @font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-display:swap;src:url(/fonts/barlow-condensed-800-italic.woff2) format('woff2')}
      @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-700.woff2) format('woff2')}
      @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-400.woff2) format('woff2')}
      @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-500.woff2) format('woff2')}
      @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-mono-600.woff2) format('woff2')}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
